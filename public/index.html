
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 Book Manager · Express + Fetch</title>

  <style>
   * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #e8eaf6, #dbeafe);
  padding: 30px 20px;
  color: #1e293b;
  min-height: 100vh;
}

.container {
  border-radius: 16px;
  max-width: 950px;
  margin: 0 auto;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  padding: 25px;
  box-shadow: 0 10px 35px rgba(30, 41, 59, 0.12);
}

h1 {
  font-size: 26px;
  margin-bottom: 20px;
  color: #1e3a8a;
  font-weight: 700;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.add-section {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.add-section input {
  padding: 10px 12px;
  border: 1px solid #cbd5e1;
  font-size: 13px;
  width: 135px;
  border-radius: 7px;
  background: #f8fafc;
  color: #1e293b;
  outline: none;
  transition: 0.2s ease;
}

.add-section input:focus {
  border-color: #6366f1;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
}

.add-section input::placeholder {
  color: #94a3b8;
}

.btn {
  border-radius: 7px;
  border: 1px solid #cbd5e1;
  background: #f1f5f9;
  color: #334155;
  padding: 9px 15px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn:hover {
  background: #e2e8f0;
  transform: translateY(-1px);
}

.btn-primary {
  background: #4f46e5;
  color: white;
  border-color: #4f46e5;
}

.btn-primary:hover {
  background: #3730a3;
  border-color: #3730a3;
}

.btn-danger {
  border-radius: 6px;
  background: #ef4444;
  color: white;
  border-color: #ef4444;
}

.btn-danger:hover {
  background: #b91c1c;
  border-color: #b91c1c;
}

.btn-sm {
  padding: 6px 11px;
  font-size: 12px;
}

.table-wrapper {
  overflow-x: auto;
  border-radius: 10px;
  border: 1px solid #e2e8f0;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  margin-top: 0;
  background: #ffffff;
}

th {
  background: #eef2ff;
  color: #3730a3;
  text-align: left;
  padding: 13px 12px;
  border-bottom: 2px solid #c7d2fe;
  font-size: 13px;
  font-weight: 700;
}

td {
  padding: 12px;
  border-bottom: 1px solid #e2e8f0;
  color: #334155;
}

tbody tr:nth-child(even) {
  background: #f8faff;
}

tbody tr:hover {
  background: #eef2ff;
}

.book-id-badge {
  font-family: monospace;
  background: #e0e7ff;
  color: #3730a3;
  padding: 4px 8px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: 600;
}

.price {
  font-weight: 700;
  color: #15803d;
}

.actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.message-box {
  margin-top: 18px;
  padding: 13px 15px;
  font-size: 13px;
  background: #eff6ff;
  border-left: 4px solid #3b82f6;
  border-radius: 6px;
  color: #1e40af;
}

.message-box.error {
  background: #fef2f2;
  border-left-color: #ef4444;
  color: #b91c1c;
}

.message-box.success {
  background: #f0fdf4;
  border-left-color: #22c55e;
  color: #166534;
}

.empty-row td {
  text-align: center;
  padding: 25px;
  color: #94a3b8;
  font-style: italic;
}

@media (max-width: 650px) {
  body {
    padding: 12px;
  }

  .container {
    padding: 15px;
  }

  h1 {
    font-size: 22px;
  }

  .add-section {
    width: 100%;
  }

  .add-section input {
    width: 100%;
  }

  .add-section .btn {
    width: 100%;
  }

  .toolbar {
    align-items: stretch;
  }

  .toolbar > .btn {
    width: 100%;
  }

  .table-wrapper {
    overflow-x: auto;
  }

  table {
    min-width: 650px;
  }
}
  </style>
</head>

<body>

<div class="container">

  <h1>📚 Book Manager</h1>

  <div class="toolbar">

    <div class="add-section">

   
      <input
        type="text"
        id="newBookID"
        placeholder="Book ID"
      />

      <input
        type="text"
        id="newTitle"
        placeholder="Title"
      />

      <input
        type="text"
        id="newAuthor"
        placeholder="Author"
      />

      <input
        type="number"
        id="newPrice"
        placeholder="Price"
        step="0.01"
        min="0"
      />

      <button class="btn btn-primary" id="addBookBtn">
        Add Book
      </button>

    </div>

    <button class="btn" id="refreshBtn">
      Refresh
    </button>

  </div>

  <div class="table-wrapper">

    <table>

      <thead>
        <tr>
          <th>Book ID</th>
          <th>Title</th>
          <th>Author</th>
          <th>Price</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="booksTableBody">
        <tr>
          <td colspan="5" class="empty-row">
            Loading books...
          </td>
        </tr>
      </tbody>

    </table>

  </div>

  <div id="messageBox" class="message-box">
    <span id="messageText">
      💡 Ready — fetch books from server
    </span>
  </div>

</div>


<script>

(function() {

  const API_BASE = 'http://localhost:3000';
  const BOOKS_ENDPOINT = `${API_BASE}/books`;

  const tbody = document.getElementById('booksTableBody');
  const messageBox = document.getElementById('messageBox');
  const messageText = document.getElementById('messageText');

  const newBookID = document.getElementById('newBookID');

  const newTitle = document.getElementById('newTitle');
  const newAuthor = document.getElementById('newAuthor');
  const newPrice = document.getElementById('newPrice');

  const addBtn = document.getElementById('addBookBtn');
  const refreshBtn = document.getElementById('refreshBtn');



  function setMessage(text, type = 'info') {

    messageBox.className = 'message-box';

    if (type === 'error') {
      messageBox.classList.add('error');
    }

    if (type === 'success') {
      messageBox.classList.add('success');
    }

    const icon =
      type === 'error' ? '❌' :
      type === 'success' ? '✅' : '💡';

    messageText.textContent = `${icon} ${text}`;

  }



  function escapeHtml(str) {

    if (str === null || str === undefined) {
      return '';
    }

    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');

  }



  async function fetchAllBooks() {

    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="empty-row">
          Loading...
        </td>
      </tr>
    `;

    try {

      const response = await fetch(BOOKS_ENDPOINT);

      if (!response.ok) {
        const err = await response.text();
        throw new Error(
          `Server responded ${response.status}: ${err || 'Failed to fetch'}`
        );
      }

      const books = await response.json();

      if (!Array.isArray(books)) {
        throw new Error('Invalid book data received from server');
      }

      renderBooksTable(books);

      setMessage(`Loaded ${books.length} book(s)`, 'success');

    } catch (error) {

      console.error('Fetch error:', error);

      tbody.innerHTML = `
        <tr>
          <td colspan="5" class="empty-row">
            ⚠️ Could not load books. Is the server running?
          </td>
        </tr>
      `;

      setMessage(`Error fetching books: ${error.message}`, 'error');

    }

  }


 
  function renderBooksTable(books) {

    if (!books || books.length === 0) {

      tbody.innerHTML = `
        <tr>
          <td colspan="5" class="empty-row">
            No books yet. Add your first book!
          </td>
        </tr>
      `;

      return;
    }

    let html = '';

    books.forEach(book => {

      const id = book.bookID ?? book.id ?? '?';
      const title = book.title ?? '(untitled)';
      const author = book.author ?? '(unknown)';

      const price =
        book.price !== undefined && book.price !== null
          ? Number(book.price).toFixed(2)
          : '—';

      html += `
        <tr>
          <td>
            <span class="book-id-badge">
              ${escapeHtml(id)}
            </span>
          </td>

          <td>${escapeHtml(title)}</td>

          <td>${escapeHtml(author)}</td>

          <td class="price">
            Rs. ${escapeHtml(price)}
          </td>

          <td class="actions">

            <button
              class="btn btn-sm edit-btn"
              data-id="${escapeHtml(id)}"
              data-title="${escapeHtml(title)}"
              data-author="${escapeHtml(author)}"
              data-price="${escapeHtml(book.price ?? '')}"
            >
              Edit
            </button>

            <button
              class="btn btn-danger btn-sm delete-btn"
              data-id="${escapeHtml(id)}"
            >
              Delete
            </button>

          </td>
        </tr>
      `;

    });

    tbody.innerHTML = html;

    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', handleEditClick);
    });

    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', handleDeleteClick);
    });

  }


  
  async function addBook() {

 
    const bookID = newBookID.value.trim();

    const title = newTitle.value.trim();
    const author = newAuthor.value.trim();
    const priceRaw = newPrice.value.trim();


    
    if (!bookID || !title || !author || !priceRaw) {

      setMessage(
        'All fields are required: Book ID, title, author and price',
        'error'
      );

      return;
    }


    const price = Number(priceRaw);

    if (!Number.isFinite(price) || price < 0) {

      setMessage(
        'Price must be a valid non-negative number',
        'error'
      );

      return;
    }


   
    const newBook = {
      bookID,
      title,
      author,
      price
    };


    try {

      const response = await fetch(BOOKS_ENDPOINT, {

        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify(newBook)

      });


      if (!response.ok) {

        const errorData = await response.json().catch(() => ({}));

        throw new Error(
          errorData.message || `POST failed with status ${response.status}`
        );

      }


      newBookID.value = '';
      newTitle.value = '';
      newAuthor.value = '';
      newPrice.value = '';


      setMessage(
        `Book "${title}" added successfully`,
        'success'
      );

      await fetchAllBooks();

    } catch (error) {

      console.error('Add error:', error);

      setMessage(
        `Could not add book: ${error.message}`,
        'error'
      );

    }

  }


  async function handleEditClick(e) {

    const btn = e.currentTarget;

    const id = btn.dataset.id;

    const oldTitle = btn.dataset.title;
    const oldAuthor = btn.dataset.author;
    const oldPrice = btn.dataset.price;


    const newTitleVal = prompt('Edit title:', oldTitle);

    if (newTitleVal === null) return;


    const newAuthorVal = prompt('Edit author:', oldAuthor);

    if (newAuthorVal === null) return;


    const newPriceVal = prompt('Edit price:', oldPrice);

    if (newPriceVal === null) return;


    const priceNum = Number(newPriceVal);

    if (
      !newTitleVal.trim() ||
      !newAuthorVal.trim() ||
      newPriceVal.trim() === '' ||
      !Number.isFinite(priceNum) ||
      priceNum < 0
    ) {

      setMessage(
        'Invalid input: title, author and price (≥0) required',
        'error'
      );

      return;
    }


    const updatedBook = {

      bookID: id,

      title: newTitleVal.trim(),

      author: newAuthorVal.trim(),

      price: priceNum

    };


    try {

      const response = await fetch(
        `${BOOKS_ENDPOINT}/${encodeURIComponent(id)}`,
        {

          method: 'PUT',

          headers: {
            'Content-Type': 'application/json'
          },

          body: JSON.stringify(updatedBook)

        }
      );


      if (!response.ok) {

        const errorData = await response.json().catch(() => ({}));

        throw new Error(
          errorData.message || `PUT failed with status ${response.status}`
        );

      }


      setMessage(`Book ID ${id} updated`, 'success');

      await fetchAllBooks();

    } catch (error) {

      console.error('Update error:', error);

      setMessage(
        `Update failed: ${error.message}`,
        'error'
      );

    }

  }

  async function handleDeleteClick(e) {

    const btn = e.currentTarget;

    const id = btn.dataset.id;


    if (!confirm(`Delete book with ID ${id}?`)) {
      return;
    }


    try {

      const response = await fetch(
        `${BOOKS_ENDPOINT}/${encodeURIComponent(id)}`,
        {
          method: 'DELETE'
        }
      );


      if (!response.ok) {

        const errorData = await response.json().catch(() => ({}));

        throw new Error(
          errorData.message || `DELETE failed with status ${response.status}`
        );

      }


      setMessage(`Book ID ${id} deleted`, 'success');

      await fetchAllBooks();

    } catch (error) {

      console.error('Delete error:', error);

      setMessage(
        `Delete failed: ${error.message}`,
        'error'
      );

    }

  }



  addBtn.addEventListener('click', addBook);

  refreshBtn.addEventListener('click', fetchAllBooks);


 
  fetchAllBooks();

})();

</script>

</body>
</html>
